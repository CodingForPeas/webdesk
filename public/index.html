<head>
  <title>Web Desk</title>
  <meta charset="UTF-8">
  <!-- index.html -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300;400;600&display=swap" rel="stylesheet" nonce="%%NONCE%%">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="ambient.css">
</head>
<body>

<div id="wallpaper"></div>

<!-- User Bar -->
<div id="user-bar">
  <span><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/icons/ui.svg#user"></use></svg> <span id="user-name">Guest</span></span>
  <button id="btn-login">Login</button>
  <button id="btn-logout" hidden>Logout</button>
  <button id="btn-wallpaper"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/icons/ui.svg#image"></use></svg> Wallpaper</button>
  <button id="btn-theme" title="Toggle theme" aria-label="Toggle theme"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/icons/ui.svg#moon"></use></svg></button>
  <span class="spacer"></span>
  <span id="sync-status">Connecting...</span>
</div>

<div id="sysmon" hidden></div>

<!-- Desktop Area -->
<div id="desktop" tabindex="0"></div>

<!-- Taskbar -->
<div id="taskbar">
  <button id="btn-start"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/icons/ui.svg#menu"></use></svg> Start</button>
  <div id="taskbar-items"></div>
  <span id="clock"></span>
  <button id="btn-notifications" title="Notifications"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/icons/ui.svg#bell"></use></svg><span class="notif-badge" id="notif-badge">0</span></button>
</div>

<!-- Start Menu -->
<div id="start-menu">
  <div class="start-header">
    <h3 id="start-welcome">Welcome</h3>
    <p id="start-subtitle">Your workspace</p>
  </div>
  <div class="start-search">
    <input id="start-search-input" placeholder="Search apps...">
  </div>
  <div class="start-apps" id="start-apps-list"></div>
  <div class="start-footer">
    <button id="btn-start-wallpaper"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/icons/ui.svg#image"></use></svg> Wallpaper</button>
    <button id="btn-start-logout" class="danger"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/icons/ui.svg#logout"></use></svg> Logout</button>
  </div>
</div>

<!-- Notifications Container -->
<div id="notif-container"></div>

<!-- Context Menu -->
<div id="ctxmenu"></div>

<!-- Add Link Modal -->
<div id="modal-bg">
  <div id="modal">
    <h3>Add a link</h3>
    <label>Title</label><input id="in-title" placeholder="e.g. Mail">
    <label>URL</label><input id="in-url" placeholder="https://homu.mortis.org.uk">
    <label>Icon URL (optional)</label><input id="in-icon" placeholder="https://homu.mortis.org.uk/icons/dawarich.svg">
    <label>Category</label><input id="in-category" placeholder="General" value="General">
    <label>Open in</label>
    <select id="in-mode">
      <option value="window">Desktop window (iframe)</option>
      <option value="tab">New browser tab</option>
    </select>
    <div class="row">
      <button class="ghost" id="m-cancel">Cancel</button>
      <button class="primary" id="m-add">Add</button>
    </div>
  </div>
</div>

<!-- Wallpaper Picker Modal -->
<div id="wallpaper-modal">
  <div id="wallpaper-picker">
    <h3>Choose Appearance</h3>
    <div class="wallpaper-grid" id="wp-grid"></div>
    <label for="icon-size-slider">Icon size <span id="icon-size-value">48px</span></label>
    <input type="range" id="icon-size-slider" min="32" max="96" step="4" value="48">
    <div class="row">
      <button class="ghost" id="wp-cancel">Close</button>
    </div>
  </div>
</div>

<!-- Edit Link Modal -->
<div id="edit-modal-bg">
  <div id="edit-modal">
    <h3>Edit link</h3>
    <label>Title</label><input id="ed-title">
    <label>URL</label><input id="ed-url">
    <label>Shared icon URL</label><input id="ed-icon" placeholder="/icons/github.svg or https://...">
    <label>Category</label><input id="ed-category">
    <label>Open in</label>
    <select id="ed-mode">
      <option value="window">Desktop window (iframe)</option>
      <option value="tab">New browser tab</option>
    </select>
    <label>My icon only (overrides for you)</label><input id="ed-local-icon" placeholder="leave blank to use shared icon">
    <p class="hint">Editing the shared fields changes this link for every user.</p>
    <div class="row">
      <button class="ghost" id="ed-cancel">Cancel</button>
      <button class="danger" id="ed-delete">Delete</button>
      <button class="primary" id="ed-save">Save</button>
    </div>
  </div>
</div>

<script type="module" src="client.js?v=3.4" nonce="%%NONCE%%"></script>

</body>
</html>
